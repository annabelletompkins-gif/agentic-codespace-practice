<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A pelican riding a bike down a hill in Switzerland</title>
  <desc>Cheerful illustration of a pelican coasting down a green alpine hill, with Swiss mountains, a chalet, a cow, and edelweiss in the background.</desc>

  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc7f0"/>
      <stop offset="60%" stop-color="#cfeafd"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec46a"/>
      <stop offset="100%" stop-color="#4f9c46"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa4b0"/>
      <stop offset="100%" stop-color="#6f7885"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky2)"/>

  <!-- Sun -->
  <circle cx="130" cy="90" r="42" fill="#fff3bf" opacity="0.95"/>
  <circle cx="130" cy="90" r="28" fill="#ffdf5c"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="330" cy="80" rx="52" ry="22"/>
    <ellipse cx="372" cy="68" rx="36" ry="18"/>
    <ellipse cx="292" cy="72" rx="30" ry="15"/>
    <ellipse cx="640" cy="120" rx="44" ry="18"/>
    <ellipse cx="676" cy="110" rx="30" ry="14"/>
  </g>

  <!-- Far snow-capped Alps -->
  <g stroke="#5a6472" stroke-width="2">
    <polygon points="360,380 520,150 680,380" fill="url(#rock)"/>
    <polygon points="520,150 570,210 545,215 520,195 495,215 470,210" fill="#ffffff"/>
    <polygon points="560,380 700,210 800,380" fill="url(#rock)"/>
    <polygon points="700,210 735,255 715,258 700,243 683,258 665,255" fill="#ffffff"/>
    <polygon points="120,380 240,235 360,380" fill="url(#rock)"/>
    <polygon points="240,235 272,275 252,278 240,263 226,278 208,275" fill="#ffffff"/>
  </g>

  <!-- Mid hills -->
  <path d="M0,360 Q160,300 340,360 Q520,300 800,355 L800,600 L0,600 Z" fill="#a9d98f"/>
  <path d="M0,400 Q200,350 420,405 Q620,355 800,400 L800,600 L0,600 Z" fill="#8ecb72"/>

  <!-- Chalet (Swiss wooden house) -->
  <g transform="translate(120,300)">
    <rect x="0" y="20" width="90" height="60" fill="#c79a63" stroke="#8a6538" stroke-width="2"/>
    <path d="M-12,20 L45,-18 L102,20 Z" fill="#8a4a35" stroke="#6d3826" stroke-width="2"/>
    <rect x="30" y="45" width="24" height="35" fill="#6d4a2a"/>
    <rect x="10" y="34" width="16" height="14" fill="#fdf6e3" stroke="#8a6538"/>
    <rect x="64" y="34" width="16" height="14" fill="#fdf6e3" stroke="#8a6538"/>
    <rect x="60" y="-16" width="10" height="22" fill="#7a7a7a"/>
    <!-- alpine flowers in window boxes -->
    <rect x="6" y="48" width="24" height="6" fill="#8a6538"/>
    <rect x="60" y="48" width="24" height="6" fill="#8a6538"/>
    <circle cx="12" cy="46" r="3" fill="#e8556d"/>
    <circle cx="22" cy="46" r="3" fill="#e8556d"/>
    <circle cx="66" cy="46" r="3" fill="#e8556d"/>
    <circle cx="76" cy="46" r="3" fill="#e8556d"/>
  </g>

  <!-- Cow with bell on the hill -->
  <g transform="translate(640,330)">
    <ellipse cx="0" cy="20" rx="40" ry="24" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5"/>
    <ellipse cx="-22" cy="8" rx="16" ry="12" fill="#3b3b3b"/>
    <ellipse cx="24" cy="18" rx="20" ry="16" fill="#3b3b3b"/>
    <rect x="-30" y="38" width="8" height="26" fill="#efefef"/>
    <rect x="-6" y="40" width="8" height="24" fill="#efefef"/>
    <rect x="16" y="40" width="8" height="24" fill="#efefef"/>
    <rect x="30" y="38" width="8" height="26" fill="#efefef"/>
    <ellipse cx="-44" cy="0" rx="16" ry="14" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5"/>
    <circle cx="-54" cy="2" r="3" fill="#2b2b2b"/>
    <path d="M-40,-12 L-48,-24 M-34,-12 L-30,-26" stroke="#5a5a5a" stroke-width="2.5" fill="none"/>
    <path d="M-58,-8 Q-70,-14 -62,-22" stroke="#5a5a5a" stroke-width="2" fill="none"/>
    <circle cx="-46" cy="24" r="5" fill="#f2c14e" stroke="#c99a2e"/>
  </g>

  <!-- Big green hill the pelican is riding down -->
  <path d="M-20,600 L-20,250 Q260,180 800,470 L800,600 Z" fill="url(#slope)"/>
  <path d="M-20,250 Q260,180 800,470" fill="none" stroke="#3f8a39" stroke-width="4" opacity="0.5"/>

  <!-- Dirt path down the hill -->
  <path d="M40,300 Q400,360 800,505" fill="none" stroke="#c9a97a" stroke-width="34" stroke-linecap="round" opacity="0.95"/>
  <path d="M40,300 Q400,360 800,505" fill="none" stroke="#e0c298" stroke-width="22" stroke-linecap="round" opacity="0.7"/>

  <!-- Edelweiss flowers on the slope -->
  <g transform="translate(250,300)" fill="#ffffff" stroke="#d9d9c2" stroke-width="1">
    <circle cx="0" cy="0" r="4" fill="#f2d24e" stroke="none"/>
    <ellipse cx="0" cy="-8" rx="4" ry="7"/>
    <ellipse cx="8" cy="0" rx="7" ry="4"/>
    <ellipse cx="-8" cy="0" rx="7" ry="4"/>
    <ellipse cx="0" cy="8" rx="4" ry="7"/>
    <ellipse cx="6" cy="-6" rx="4" ry="6" transform="rotate(45 6 -6)"/>
    <ellipse cx="-6" cy="6" rx="4" ry="6" transform="rotate(45 -6 6)"/>
  </g>
  <g transform="translate(470,360)" fill="#ffffff" stroke="#d9d9c2" stroke-width="1">
    <circle cx="0" cy="0" r="3.5" fill="#f2d24e" stroke="none"/>
    <ellipse cx="0" cy="-7" rx="3.5" ry="6"/>
    <ellipse cx="7" cy="0" rx="6" ry="3.5"/>
    <ellipse cx="-7" cy="0" rx="6" ry="3.5"/>
    <ellipse cx="0" cy="7" rx="3.5" ry="6"/>
  </g>

  <!-- Grass tufts -->
  <g stroke="#3f8a39" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M180,360 l-4,-14 M186,360 l0,-16 M192,360 l4,-14"/>
    <path d="M560,420 l-4,-14 M566,420 l0,-16 M572,420 l4,-14"/>
    <path d="M700,475 l-4,-13 M706,475 l0,-15 M712,475 l4,-13"/>
  </g>

  <!-- Bicycle + pelican, tilted to coast downhill (facing right, going down) -->
  <g transform="translate(430,395) rotate(19)">
    <!-- Bicycle -->
    <g stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="-70" cy="75" r="46"/>
      <circle cx="90" cy="75" r="46"/>
      <g stroke="#4a4a4a" stroke-width="2">
        <line x1="-70" y1="29" x2="-70" y2="121"/>
        <line x1="-116" y1="75" x2="-24" y2="75"/>
        <line x1="-102" y1="43" x2="-38" y2="107"/>
        <line x1="-38" y1="43" x2="-102" y2="107"/>
        <line x1="90" y1="29" x2="90" y2="121"/>
        <line x1="44" y1="75" x2="136" y2="75"/>
        <line x1="58" y1="43" x2="122" y2="107"/>
        <line x1="122" y1="43" x2="58" y2="107"/>
      </g>
      <path d="M-70,75 L10,75 L60,-10 L10,-10 M10,75 L60,-10 M10,-10 L-10,-30 M10,75 L0,-8 M60,-10 L90,75"/>
      <path d="M-12,-32 L22,-42"/>
      <path d="M22,-42 L34,-34"/>
      <path d="M58,-16 L86,-12" stroke-linecap="round" stroke-width="9"/>
      <circle cx="10" cy="75" r="7" fill="#2b2b2b"/>
      <path d="M10,75 L40,95 M10,75 L-20,55"/>
      <rect x="36" y="92" width="20" height="6" fill="#2b2b2b"/>
      <rect x="-38" y="52" width="20" height="6" fill="#2b2b2b"/>
    </g>

    <!-- Pelican -->
    <g>
      <ellipse cx="0" cy="40" rx="62" ry="52" fill="#f7f7f4" stroke="#cfd2d4" stroke-width="2"/>
      <path d="M-55,30 Q-95,20 -100,45 Q-70,52 -50,58 Z" fill="#e6e8e9" stroke="#cfd2d4" stroke-width="2"/>
      <path d="M-30,20 Q25,-5 55,30 Q20,60 -25,55 Q-45,40 -30,20 Z" fill="#e2e6e8" stroke="#cfd2d4" stroke-width="2"/>
      <path d="M-10,88 Q-25,120 -12,140" stroke="#e8a13a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M30,88 Q45,120 38,140" stroke="#e8a13a" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-12,140 L-30,150 L0,150 Z" fill="#e8a13a"/>
      <path d="M38,140 L20,150 L52,150 Z" fill="#e8a13a"/>
      <path d="M25,-5 Q55,-60 70,-110" stroke="#f7f7f4" stroke-width="26" fill="none" stroke-linecap="round"/>
      <circle cx="74" cy="-118" r="26" fill="#f7f7f4" stroke="#cfd2d4" stroke-width="2"/>
      <circle cx="84" cy="-124" r="5" fill="#2b2b2b"/>
      <circle cx="86" cy="-126" r="1.8" fill="#ffffff"/>
      <path d="M96,-118 Q150,-116 158,-100 Q120,-104 96,-106 Z" fill="#f2b134" stroke="#d99420" stroke-width="2"/>
      <path d="M96,-104 Q120,-104 150,-102 Q130,-72 100,-88 Z" fill="#f7c453" stroke="#d99420" stroke-width="2"/>
      <!-- scarf blowing back in the wind -->
      <path d="M40,-2 Q10,6 -30,0 Q-60,-4 -95,-14 Q-60,14 -20,18 Q10,20 40,12 Z" fill="#e8556d" stroke="#c7384f" stroke-width="2"/>
      <!-- helmet -->
      <path d="M50,-132 Q74,-160 100,-132 Q74,-124 50,-132 Z" fill="#c94f4f" stroke="#a83b3b" stroke-width="2"/>
      <path d="M50,-134 Q74,-126 100,-134" stroke="#a83b3b" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Speed / motion lines behind the pelican -->
  <g stroke="#3f8a39" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <line x1="150" y1="300" x2="260" y2="322"/>
    <line x1="140" y1="340" x2="270" y2="360"/>
    <line x1="160" y1="380" x2="300" y2="396"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="180" y1="320" x2="240" y2="330"/>
    <line x1="175" y1="360" x2="250" y2="372"/>
  </g>

  <!-- Swiss flag -->
  <g transform="translate(710,180)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#6b4a2b" stroke-width="5"/>
    <rect x="0" y="4" width="52" height="52" fill="#d52b1e" stroke="#a81f16" stroke-width="2"/>
    <rect x="20" y="14" width="12" height="32" fill="#ffffff"/>
    <rect x="10" y="24" width="32" height="12" fill="#ffffff"/>
  </g>
</svg>
