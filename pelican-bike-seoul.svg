<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A pelican riding a bike by Namsan Tower in Seoul</title>
  <desc>Cheerful illustration of a pelican cycling past a cherry-blossom path with N Seoul Tower on Namsan mountain, the city skyline, love locks, and the Korean flag.</desc>

  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7d3f2"/>
      <stop offset="55%" stop-color="#dceffb"/>
      <stop offset="100%" stop-color="#ffe7ef"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa88a"/>
      <stop offset="100%" stop-color="#4f7a5c"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8d2da"/>
      <stop offset="50%" stop-color="#eef3f7"/>
      <stop offset="100%" stop-color="#9fabb5"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9adb3"/>
      <stop offset="100%" stop-color="#8a8f95"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky3)"/>

  <!-- Sun -->
  <circle cx="120" cy="95" r="40" fill="#fff0c4" opacity="0.95"/>
  <circle cx="120" cy="95" r="27" fill="#ffe07a"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="330" cy="85" rx="55" ry="22"/>
    <ellipse cx="374" cy="72" rx="38" ry="18"/>
    <ellipse cx="290" cy="76" rx="32" ry="15"/>
    <ellipse cx="600" cy="130" rx="42" ry="17"/>
    <ellipse cx="634" cy="120" rx="28" ry="13"/>
  </g>

  <!-- Distant city skyline -->
  <g fill="#b9c6d4" opacity="0.85">
    <rect x="30" y="330" width="34" height="90"/>
    <rect x="70" y="300" width="28" height="120"/>
    <rect x="104" y="345" width="40" height="75"/>
    <rect x="150" y="315" width="26" height="105"/>
    <rect x="182" y="355" width="36" height="65"/>
    <rect x="224" y="335" width="30" height="85"/>
    <rect x="262" y="360" width="44" height="60"/>
    <rect x="315" y="340" width="30" height="80"/>
    <rect x="352" y="365" width="40" height="55"/>
    <rect x="400" y="350" width="28" height="70"/>
    <rect x="436" y="368" width="46" height="52"/>
    <polygon points="520,330 536,295 552,330" opacity="0.6"/>
  </g>

  <!-- Namsan mountain -->
  <path d="M380,420 Q560,270 800,420 L800,470 L380,470 Z" fill="url(#mountain)"/>
  <path d="M380,420 Q560,270 800,420" fill="none" stroke="#3d6349" stroke-width="3" opacity="0.5"/>

  <!-- Namsan mountain trees -->
  <g fill="#3f8a54" opacity="0.9">
    <circle cx="470" cy="400" r="18"/>
    <circle cx="505" cy="385" r="22"/>
    <circle cx="548" cy="372" r="20"/>
    <circle cx="590" cy="368" r="24"/>
    <circle cx="636" cy="378" r="20"/>
    <circle cx="686" cy="392" r="22"/>
    <circle cx="740" cy="408" r="20"/>
  </g>
  <g fill="#63ad6f" opacity="0.7">
    <circle cx="500" cy="378" r="12"/>
    <circle cx="580" cy="360" r="13"/>
    <circle cx="660" cy="372" r="12"/>
    <circle cx="720" cy="398" r="12"/>
  </g>

  <!-- N Seoul Tower on top of Namsan -->
  <g transform="translate(560,150)">
    <!-- base -->
    <path d="M-30,270 L-14,60 L14,60 L30,270 Z" fill="url(#tower)" stroke="#7f8a94" stroke-width="2"/>
    <!-- observation deck -->
    <rect x="-40" y="40" width="80" height="26" rx="6" fill="#dbe4ea" stroke="#7f8a94" stroke-width="2"/>
    <rect x="-46" y="36" width="92" height="10" rx="4" fill="#c8d2da" stroke="#7f8a94" stroke-width="2"/>
    <!-- windows -->
    <g fill="#8fb8d6" stroke="#7f8a94" stroke-width="1.5">
      <rect x="-30" y="44" width="9" height="16"/>
      <rect x="-15" y="44" width="9" height="16"/>
      <rect x="0" y="44" width="9" height="16"/>
      <rect x="15" y="44" width="9" height="16"/>
    </g>
    <!-- antenna / crown -->
    <rect x="-5" y="-30" width="10" height="72" fill="#aeb9c2" stroke="#7f8a94" stroke-width="1.5"/>
    <path d="M-4,-30 L4,-30 L2,-46 L-2,-46 Z" fill="#f2b134" stroke="#c98d1c" stroke-width="1.5"/>
    <circle cx="0" cy="-50" r="4" fill="#e8556d"/>
    <line x1="-14" y1="6" x2="14" y2="6" stroke="#7f8a94" stroke-width="2"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#7f8a94" stroke-width="2"/>
  </g>

  <!-- Cable car to Namsan -->
  <g stroke="#5a5a5a" stroke-width="2">
    <line x1="300" y1="250" x2="470" y2="300"/>
    <line x1="470" y1="300" x2="560" y2="325"/>
  </g>
  <g transform="translate(400,268)">
    <line x1="0" y1="-8" x2="0" y2="-20" stroke="#5a5a5a" stroke-width="2"/>
    <rect x="-16" y="-8" width="32" height="20" rx="4" fill="#5aa9c9" stroke="#3d7f99" stroke-width="2"/>
    <rect x="-12" y="-4" width="10" height="10" fill="#eaf6fb"/>
    <rect x="2" y="-4" width="10" height="10" fill="#eaf6fb"/>
  </g>

  <!-- Foreground hill / park (Namsan park) -->
  <path d="M0,470 Q220,430 460,470 Q660,500 800,480 L800,600 L0,600 Z" fill="#7ec46a"/>
  <path d="M0,505 Q240,470 500,510 Q660,535 800,520 L800,600 L0,600 Z" fill="#63ad6f"/>

  <!-- Bike path through the park -->
  <path d="M-20,560 Q200,520 460,545 Q660,565 820,545" fill="none" stroke="url(#road)" stroke-width="52" stroke-linecap="round"/>
  <g stroke="#f2f2f2" stroke-width="4" stroke-dasharray="26 22" opacity="0.8">
    <path d="M-20,560 Q200,520 460,545 Q660,565 820,545" fill="none"/>
  </g>

  <!-- Cherry blossom trees -->
  <g>
    <!-- tree 1 -->
    <rect x="150" y="360" width="12" height="90" fill="#6b4a2b"/>
    <path d="M156,400 L128,378 M156,410 L186,388" stroke="#6b4a2b" stroke-width="8" stroke-linecap="round"/>
    <g fill="#ffc0d4">
      <circle cx="120" cy="352" r="30"/>
      <circle cx="160" cy="336" r="34"/>
      <circle cx="198" cy="356" r="28"/>
      <circle cx="150" cy="318" r="26"/>
    </g>
    <g fill="#ffd9e6">
      <circle cx="140" cy="340" r="14"/>
      <circle cx="182" cy="348" r="14"/>
      <circle cx="164" cy="322" r="12"/>
    </g>
    <!-- tree 2 (right) -->
    <rect x="700" y="380" width="12" height="80" fill="#6b4a2b"/>
    <g fill="#ffc0d4">
      <circle cx="672" cy="372" r="28"/>
      <circle cx="712" cy="358" r="32"/>
      <circle cx="748" cy="378" r="26"/>
    </g>
    <g fill="#ffd9e6">
      <circle cx="692" cy="362" r="13"/>
      <circle cx="730" cy="370" r="13"/>
    </g>
  </g>

  <!-- Falling cherry blossom petals -->
  <g fill="#ffb3ca" opacity="0.9">
    <ellipse cx="250" cy="300" rx="6" ry="4" transform="rotate(20 250 300)"/>
    <ellipse cx="300" cy="350" rx="6" ry="4" transform="rotate(-30 300 350)"/>
    <ellipse cx="380" cy="320" rx="6" ry="4" transform="rotate(35 380 320)"/>
    <ellipse cx="450" cy="380" rx="6" ry="4" transform="rotate(-15 450 380)"/>
    <ellipse cx="220" cy="400" rx="6" ry="4" transform="rotate(45 220 400)"/>
    <ellipse cx="600" cy="330" rx="6" ry="4" transform="rotate(10 600 330)"/>
    <ellipse cx="660" cy="430" rx="6" ry="4" transform="rotate(-40 660 430)"/>
  </g>

  <!-- Love-locks fence (famous at Namsan) -->
  <g transform="translate(60,430)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#7f8a94" stroke-width="4"/>
    <line x1="70" y1="-6" x2="70" y2="64" stroke="#7f8a94" stroke-width="4"/>
    <line x1="-6" y1="6" x2="76" y2="6" stroke="#7f8a94" stroke-width="4"/>
    <line x1="-6" y1="40" x2="76" y2="40" stroke="#7f8a94" stroke-width="3"/>
    <g stroke="#b03c53" stroke-width="2">
      <rect x="10" y="42" width="16" height="16" rx="3" fill="#e8556d"/>
      <path d="M18,45 q-4,-4 -6,0 q-2,3 6,8 q8,-5 6,-8 q-2,-4 -6,0 z" fill="#ffffff" stroke="none" transform="translate(-1,1)"/>
      <rect x="36" y="42" width="16" height="16" rx="3" fill="#f2b134"/>
      <rect x="22" y="12" width="16" height="16" rx="3" fill="#5aa9c9"/>
    </g>
  </g>

  <!-- Hanok-style tiled roof in the corner -->
  <g transform="translate(600,440)">
    <path d="M-40,26 Q0,-6 60,20 L54,34 Q8,12 -34,40 Z" fill="#4a4a4a"/>
    <path d="M-40,26 Q0,-6 60,20" fill="none" stroke="#2f2f2f" stroke-width="3"/>
    <path d="M-34,40 Q8,12 54,34" fill="none" stroke="#2f2f2f" stroke-width="2"/>
  </g>

  <!-- Korean flag (Taegukgi) -->
  <g transform="translate(700,150)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#6b4a2b" stroke-width="5"/>
    <rect x="4" y="-64" width="72" height="48" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <!-- taegeuk circle -->
    <circle cx="40" cy="-40" r="12" fill="#cd2e3a"/>
    <path d="M40,-52 A12,12 0 0 0 40,-28 A6,6 0 0 1 40,-40 A6,6 0 0 0 40,-52 Z" fill="#0047a0"/>
    <!-- four trigrams -->
    <g fill="#1a1a1a">
      <g transform="translate(14,-52) rotate(-56)">
        <rect x="0" y="0" width="14" height="3"/><rect x="0" y="5" width="14" height="3"/><rect x="0" y="10" width="14" height="3"/>
      </g>
      <g transform="translate(60,-52) rotate(56)">
        <rect x="0" y="0" width="6" height="3"/><rect x="8" y="0" width="6" height="3"/>
        <rect x="0" y="5" width="14" height="3"/><rect x="0" y="10" width="14" height="3"/>
      </g>
      <g transform="translate(14,-30) rotate(56)">
        <rect x="0" y="0" width="14" height="3"/><rect x="0" y="5" width="6" height="3"/><rect x="8" y="5" width="6" height="3"/>
        <rect x="0" y="10" width="14" height="3"/>
      </g>
      <g transform="translate(60,-30) rotate(-56)">
        <rect x="0" y="0" width="6" height="3"/><rect x="8" y="0" width="6" height="3"/>
        <rect x="0" y="5" width="6" height="3"/><rect x="8" y="5" width="6" height="3"/>
        <rect x="0" y="10" width="6" height="3"/><rect x="8" y="10" width="6" height="3"/>
      </g>
    </g>
  </g>

  <!-- Bicycle -->
  <g transform="translate(430,470)" stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="-70" cy="75" r="46"/>
    <circle cx="90" cy="75" r="46"/>
    <g stroke="#4a4a4a" stroke-width="2">
      <line x1="-70" y1="29" x2="-70" y2="121"/>
      <line x1="-116" y1="75" x2="-24" y2="75"/>
      <line x1="-102" y1="43" x2="-38" y2="107"/>
      <line x1="-38" y1="43" x2="-102" y2="107"/>
      <line x1="90" y1="29" x2="90" y2="121"/>
      <line x1="44" y1="75" x2="136" y2="75"/>
      <line x1="58" y1="43" x2="122" y2="107"/>
      <line x1="122" y1="43" x2="58" y2="107"/>
    </g>
    <path d="M-70,75 L10,75 L60,-10 L10,-10 M10,75 L60,-10 M10,-10 L-10,-30 M10,75 L0,-8 M60,-10 L90,75"/>
    <path d="M-12,-32 L22,-42"/>
    <path d="M22,-42 L34,-34"/>
    <path d="M58,-16 L86,-12" stroke-linecap="round" stroke-width="9"/>
    <circle cx="10" cy="75" r="7" fill="#2b2b2b"/>
    <path d="M10,75 L40,95 M10,75 L-20,55"/>
    <rect x="36" y="92" width="20" height="6" fill="#2b2b2b"/>
    <rect x="-38" y="52" width="20" height="6" fill="#2b2b2b"/>
  </g>

  <!-- Pelican -->
  <g transform="translate(445,330)">
    <ellipse cx="0" cy="40" rx="62" ry="52" fill="#f7f7f4" stroke="#cfd2d4" stroke-width="2"/>
    <path d="M-55,30 Q-95,20 -100,45 Q-70,52 -50,58 Z" fill="#e6e8e9" stroke="#cfd2d4" stroke-width="2"/>
    <path d="M-30,20 Q25,-5 55,30 Q20,60 -25,55 Q-45,40 -30,20 Z" fill="#e2e6e8" stroke="#cfd2d4" stroke-width="2"/>
    <path d="M-10,88 Q-25,120 -12,140" stroke="#e8a13a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M30,88 Q45,120 38,140" stroke="#e8a13a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-12,140 L-30,150 L0,150 Z" fill="#e8a13a"/>
    <path d="M38,140 L20,150 L52,150 Z" fill="#e8a13a"/>
    <path d="M25,-5 Q55,-60 70,-110" stroke="#f7f7f4" stroke-width="26" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="-118" r="26" fill="#f7f7f4" stroke="#cfd2d4" stroke-width="2"/>
    <circle cx="84" cy="-124" r="5" fill="#2b2b2b"/>
    <circle cx="86" cy="-126" r="1.8" fill="#ffffff"/>
    <path d="M96,-118 Q150,-116 158,-100 Q120,-104 96,-106 Z" fill="#f2b134" stroke="#d99420" stroke-width="2"/>
    <path d="M96,-104 Q120,-104 150,-102 Q130,-72 100,-88 Z" fill="#f7c453" stroke="#d99420" stroke-width="2"/>
    <!-- helmet -->
    <path d="M50,-132 Q74,-160 100,-132 Q74,-124 50,-132 Z" fill="#c94f4f" stroke="#a83b3b" stroke-width="2"/>
    <path d="M50,-134 Q74,-126 100,-134" stroke="#a83b3b" stroke-width="2" fill="none"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="250" y1="530" x2="340" y2="530"/>
    <line x1="240" y1="555" x2="330" y2="555"/>
    <line x1="260" y1="580" x2="350" y2="580"/>
  </g>
</svg>
